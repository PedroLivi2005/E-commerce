        <form id="meuFormulario">
            <label for="usuario_id">ID do Usuário:</label>
            <input type="number" id="usuario_id" name="usuario_id" required>
            <br><br>

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" required></textarea>
            <br><br>

            <button type="submit" id="btnEnviar">Enviar</button>
        </form>

        <p id="resultado"></p>

        <script>
            const form = document.getElementById('meuFormulario');
            const resultado = document.getElementById('resultado');

            form.addEventListener('submit', async (e) => {
            // Impede o recarregamento padrão da página ao enviar o form
            e.preventDefault();

            // Captura automaticamente todos os campos do form pelo atributo 'name'
            const formData = new FormData(form);

            try {
                const response = await fetch('processa.php', {
                method: 'POST',
                body: formData // Não defina Content-Type no header; o navegador define o multipart boundary automaticamente
                });

                const data = await response.json();
                
                if (data.status === 'sucesso') {
                resultado.innerText = `Sucesso: ${data.resposta}`;
                form.reset(); // Limpa os campos após o envio
                } else {
                resultado.innerText = `Erro: ${data.resposta}`;
                }
            } catch (erro) {
                console.error('Erro na requisição:', erro);
                resultado.innerText = 'Falha ao conectar com o servidor.';
            }
            });
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
